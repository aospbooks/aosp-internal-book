# Source of truth for the AOSP Internals plugin packaging.
# Edited by hand. agents/build.py reads this to know which chapters
# belong to which Part-skill and to find the canonical chapter Markdown
# at the repo root.

name = "aosp-internals"
version = "2026.05.11"
repo_url = "https://github.com/aospbooks/aosp-internal-book"
site_url = "https://aospbooks.github.io/aosp-internal-book/"
description = "AOSP Internals book content (64 chapters + 2 appendices) packaged as 16 Part-skills."

[[parts]]
id = "01-getting-started"
roman = "I"
title = "Getting Started"
chapters = ["00-frontmatter", "01-introduction", "02-source-and-build", "03-feature-flags"]

